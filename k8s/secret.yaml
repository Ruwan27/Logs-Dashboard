apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: logs-dashboard
  labels:
    app.kubernetes.io/name: logs-dashboard-db
    app.kubernetes.io/component: database
type: Opaque
# Base64 encoded values - CHANGE THESE IN PRODUCTION!
# To encode: echo -n 'your-value' | base64
data:
  # postgres (base64)
  POSTGRES_USER: cG9zdGdyZXM=
  # postgres (base64) - CHANGE THIS!
  POSTGRES_PASSWORD: cG9zdGdyZXM=
  # logs_dashboard (base64)
  POSTGRES_DB: bG9nc19kYXNoYm9hcmQ=
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: logs-dashboard
  labels:
    app.kubernetes.io/name: logs-dashboard-backend
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  # DATABASE_URL format: postgresql://user:password@host:port/dbname
  DATABASE_URL: "postgresql://postgres:postgres@postgres-service:5432/logs_dashboard"
