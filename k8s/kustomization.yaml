apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: logs-dashboard

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres-pvc.yaml
  - postgres-deployment.yaml
  - backend-deployment.yaml
  - frontend-deployment.yaml
  # Uncomment based on your needs:
  # - ingress.yaml
  # - hpa.yaml
  # - networkpolicy.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: logs-dashboard

# Image customization (override in overlays)
images:
  - name: logs-dashboard-backend
    newTag: latest
